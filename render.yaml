services:
  - type: web
    name: sistema-analise-eleitoral
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --no-input"
    startCommand: "python manage.py migrate --no-input && python ingestao_pdf.py && gunicorn sistema_analise_eleitoral.wsgi:application"
