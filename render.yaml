services:
  - type: web
    name: sistema-analise-eleitoral
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python sistema_analise_eleitoral/manage.py collectstatic --no-input && python sistema_analise_eleitoral/manage.py migrate"
    startCommand: "gunicorn --pythonpath sistema_analise_eleitoral sistema_analise_eleitoral.wsgi:application"
